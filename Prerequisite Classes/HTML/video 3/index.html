<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>

<body>
    <h1>Welcom back to learn Form...</h1>

    <form action="">
        <fieldset>
            <legend>Personla Information</legend>

            <label for="name">Name:</label>
            <input id="name" type="text" placeholder="Enter Name">

            <br><br>

            <label for="father">Father:</label>
            <input id="father" type="text" placeholder="Enter Father Name">

            <br><br>

            <label for="sur">SurName:</label>
            <input id="sur" type="text" placeholder="Enter Surname">

            <br><br>

            <label for="option">Select Course:</label>
            <select name="" id="option">
                <optgroup label="FrontEnd">
                    <option value="HTML">HTML</option>
                    <option value="CSS">CSS</option>
                    <option value="JS">JS</option>
                </optgroup>

                <optgroup label="BackEnd">
                    <option value="Node.js">Node.js</option>
                    <option value="Express.js">Express.js</option>
                    <option value="Mangodb">Mongodb</option>
                </optgroup>
            </select>

            <br><br>

            <label for="reviews">Reviews</label>
            <textarea name="" id="reviews" cols="25" rows="5"></textarea>

            <br><br>

            <label for="range">Set Range:</label>
            <input type="range" max="100" value="30">

            <br><br>

            <label for="color">Set Color:</label>
            <input type="color" name="" id="color">

            <br><br>

            <label for="">Hobby:</label>
            <input type="checkbox" name="" id="1st">
            <label for="1st">Badminton</label>
            <input type="checkbox" id="2nd">
            <label for="2nd">Cricket</label>
            <input type="checkbox" id="3rd">
            <label for="3rd">Kho-Kho</label>
            <input type="checkbox" id="4th">
            <label for="4th">Kabaddi</label>

            <br><br>

            <label for="">Course:</label>
            <input type="radio" id="5th" name="course">
            <label for="5th">Python</label>
            <input type="radio" id="6th" name="course">
            <label for="6th">Java</label>
            <input type="radio" id="7th" name="course">
            <label for="7th">C++</label>
            <input type="radio" id="8th" name="course">
            <label for="8th">Node.js</label>

            <br><br>

            <button type="reset">Reset Form</button>
            <button type="submit">Submit Form</button>

            <br><br>


        </fieldset>


        <br>


    </form>

</body>

</html>
